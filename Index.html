<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(237, 183, 9, 0.8); }
    .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #EDB709; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    .live-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; animation: pulse-green 2s infinite; }
    select option { background-color: #0f172a; color: white; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans antialiased selection:bg-[#EDB709] selection:text-slate-900">
  <div class="fixed inset-0 z-0 bg-gradient-to-br from-[#05101a] via-[#002B49] to-[#020617] opacity-90"></div>
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-[#EDB709] rounded-full mix-blend-screen filter blur-[120px] opacity-20 z-0 pointer-events-none"></div>
  <div id="root" class="relative z-10 p-4 md:p-8"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [loading, setLoading] = useState(true);
      const [rawData, setRawData] = useState([]);
      const [availableSites, setAvailableSites] = useState([]);
      const [selectedSiteFilter, setSelectedSiteFilter] = useState('Todos');
      const [metrics, setMetrics] = useState({ totalHours: 0, totalTasks: 0, routinePct: 0 });
      const [team, setTeam] = useState([]);
      const [selectedPerson, setSelectedPerson] = useState(null);
      const [isExpanded, setIsExpanded] = useState(false);
      const [searchDetail, setSearchDetail] = useState('');

      const initialColFilters = {
        atividade: 'Todos',
        categoria: 'Todos',
        frequencia: 'Todos',
        juridica: 'Todos',
        desc: '',
        tempo: 'Todos',
        horas: 'Todos'
      };
      const [colFilters, setColFilters] = useState(initialColFilters);

      const selectedPersonRef = useRef(null);
      selectedPersonRef.current = selectedPerson;

      const toggleExpand = () => {
        if (typeof google !== 'undefined' && google.script && google.script.host) {
          if (!isExpanded) {
            google.script.host.setWidth(Math.min(window.screen.availWidth - 40, 1920));
            google.script.host.setHeight(Math.min(window.screen.availHeight - 80, 1080));
            setIsExpanded(true);
          } else {
            google.script.host.setWidth(1200);
            google.script.host.setHeight(800);
            setIsExpanded(false);
          }
        }
      };

      const handleOpenNewTab = () => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run.withSuccessHandler((url) => {
            if (url) window.open(url, '_blank');
          }).obterUrlWebApp();
        }
      };

      const fetchData = () => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(function(resposta) {
              const dados = JSON.parse(resposta);
              setRawData(dados);
              const sitesUnicos = [...new Set(dados.map(d => d.site).filter(s => s && s !== '-'))].sort();
              setAvailableSites(sitesUnicos);
              setLoading(false);
            })
            .obterDadosDaPlanilha();
        }
      };

      useEffect(() => {
        fetchData();
        const intervalId = setInterval(fetchData, 10000);
        return () => clearInterval(intervalId);
      }, []);

      useEffect(() => {
        if (rawData.length === 0) return;
        const dadosFiltrados = selectedSiteFilter === 'Todos' ? rawData : rawData.filter(d => d.site === selectedSiteFilter);
        let tHours = 0; let rHours = 0; let validTasks = 0;
        const profMap = {};

        dadosFiltrados.forEach(item => {
          const nomePessoa = String(item.nome).trim();
          if (!nomePessoa || nomePessoa.toLowerCase() === 'nome') return;
          validTasks += 1;
          tHours += item.horas_mes;

          const frequenciaAtividade = String(item.frequencia).trim().toLowerCase();
          if (frequenciaAtividade === 'diária' || frequenciaAtividade === 'diaria' || frequenciaAtividade === 'semanal') {
            rHours += item.horas_mes;
          }

          if (!profMap[nomePessoa]) {
            profMap[nomePessoa] = { name: nomePessoa, hours: 0, tasks: 0, activities: [] };
          }
          profMap[nomePessoa].hours += item.horas_mes;
          profMap[nomePessoa].tasks += 1;
          profMap[nomePessoa].activities.push(item);
        });

        const profArray = Object.values(profMap).map(p => {
          let maxAct = p.activities[0];
          p.activities.forEach(a => { if (a.horas_mes > maxAct.horas_mes) maxAct = a; });
          let descGargalo = maxAct ? (maxAct.desc2 || maxAct.descricao || 'Atividade') : 'Sem tarefas';
          if (descGargalo.length > 30) descGargalo = descGargalo.substring(0, 30) + '...';

          const catMap = {};
          p.activities.forEach(a => {
            const catName = a.desc2 !== '-' ? a.desc2 : (a.categoria || 'Outros');
            if (!catMap[catName]) catMap[catName] = 0;
            catMap[catName] += a.horas_mes;
          });

          const topCategories = Object.keys(catMap)
            .map(k => ({ name: k, hours: parseFloat(catMap[k].toFixed(1)) }))
            .sort((a, b) => b.hours - a.hours)
            .slice(0, 5);

          return {
            name: p.name,
            hours: parseFloat(p.hours.toFixed(1)),
            tasks: p.tasks,
            bottleneck: maxAct ? `${descGargalo} (${maxAct.horas_mes}h)` : '-',
            topCategories: topCategories,
            activities: p.activities.sort((a, b) => b.horas_mes - a.horas_mes)
          };
        }).sort((a, b) => b.hours - a.hours);

        setMetrics({
          totalHours: parseFloat(tHours.toFixed(1)),
          totalTasks: validTasks,
          routinePct: tHours > 0 ? ((rHours / tHours) * 100).toFixed(1) : 0
        });
        setTeam(profArray);

        if (selectedPersonRef.current) {
          const updatedPerson = profArray.find(p => p.name === selectedPersonRef.current.name);
          if (updatedPerson) setSelectedPerson(updatedPerson);
          else setSelectedPerson(null);
        }
      }, [rawData, selectedSiteFilter]);

      const handleSelectPerson = (person) => {
        setSearchDetail('');
        setColFilters(initialColFilters);
        setSelectedPerson(person);
      };

      const handleColFilterChange = (key, value) => {
        setColFilters(prev => ({ ...prev, [key]: value }));
      };

      const resetAllFilters = () => {
        setSearchDetail('');
        setColFilters(initialColFilters);
      };

      if (loading) {
        return (
          <div className="min-h-[80vh] flex flex-col items-center justify-center animate-fade-in">
            <div className="spinner mb-4"></div>
            <h2 className="text-[#EDB709] tracking-widest uppercase text-sm font-bold">Connecting to Database...</h2>
          </div>
        );
      }

      const maxHours = team.length > 0 ? team[0].hours : 100;

      const Header = () => (
        <header className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-10 bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl shadow-2xl">
          <div>
            <div className="flex items-center gap-3 mb-1">
              <div className="w-3 h-3 rounded-full bg-[#EDB709] shadow-[0_0_10px_#EDB709]"></div>
              <h1 className="text-sm font-bold tracking-widest text-[#EDB709] uppercase">Enterprise Legal Operations</h1>
            </div>
            <h2 className="text-3xl md:text-4xl font-light text-white">Strategic Workload Dashboard <span className="font-bold">2026</span></h2>
          </div>
          <div className="mt-6 lg:mt-0 flex flex-wrap items-center gap-3">
            <div className="flex items-center gap-3 bg-slate-800/50 border border-white/10 px-4 py-2 rounded-full backdrop-blur-md">
              <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Site:</span>
              <select value={selectedSiteFilter} onChange={(e) => setSelectedSiteFilter(e.target.value)} className="bg-transparent text-white text-sm font-semibold outline-none cursor-pointer border-none">
                <option value="Todos">Global (Todos)</option>
                {availableSites.map(site => <option key={site} value={site}>{site}</option>)}
              </select>
            </div>
            <div className="flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-2 rounded-full">
              <div className="live-dot"></div>
              <span className="text-xs font-semibold text-slate-300 uppercase tracking-widest">Live Sync</span>
            </div>
            <button onClick={toggleExpand} className="flex items-center gap-2 bg-[#EDB709] hover:bg-[#d4a307] text-slate-950 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider transition-all duration-300 shadow-[0_0_15px_rgba(237,183,9,0.3)] active:scale-95 cursor-pointer">
              {isExpanded ? '↙ Restaurar' : '⛶ Expandir'}
            </button>
            <button onClick={handleOpenNewTab} className="flex items-center gap-2 bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/40 text-blue-300 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider transition-all duration-300 active:scale-95 cursor-pointer">
              🌐 Nova Aba
            </button>
          </div>
        </header>
      );

      if (selectedPerson) {
        const maxCatHours = selectedPerson.topCategories.length > 0 ? selectedPerson.topCategories[0].hours : 100;
        const optAtivs = ['Todos', ...new Set(selectedPerson.activities.map(a => a.desc2).filter(c => c && c !== '-'))].sort();
        const optCats = ['Todos', ...new Set(selectedPerson.activities.map(a => a.tipo).filter(c => c && c !== '-'))].sort();
        const optFreqs = ['Todos', ...new Set(selectedPerson.activities.map(a => a.frequencia).filter(f => f && f !== '-'))].sort();
        const optJurs = ['Todos', ...new Set(selectedPerson.activities.map(a => a.juridica).filter(j => j && j !== '-'))].sort();
        const optTempos = ['Todos', ...[...new Set(selectedPerson.activities.map(a => a.tempo_gasto))].sort((a, b) => a - b)];
        const optHoras = ['Todos', ...[...new Set(selectedPerson.activities.map(a => a.horas_mes))].sort((a, b) => a - b)];

        const filteredActivities = selectedPerson.activities.filter(act => {
          const matchGlobalSearch = !searchDetail ||
            (act.descricao && act.descricao.toLowerCase().includes(searchDetail.toLowerCase())) ||
            (act.desc2 && act.desc2.toLowerCase().includes(searchDetail.toLowerCase())) ||
            (act.tipo && act.tipo.toLowerCase().includes(searchDetail.toLowerCase()));
          const matchAtiv = colFilters.atividade === 'Todos' || String(act.desc2).trim() === colFilters.atividade;
          const matchCat = colFilters.categoria === 'Todos' || String(act.tipo).trim() === colFilters.categoria;
          const matchFreq = colFilters.frequencia === 'Todos' || String(act.frequencia).trim() === colFilters.frequencia;
          const matchJur = colFilters.juridica === 'Todos' || String(act.juridica).trim().toLowerCase() === colFilters.juridica.toLowerCase();
          const matchDescCol = !colFilters.desc || (act.descricao && act.descricao.toLowerCase().includes(colFilters.desc.toLowerCase()));
          const matchTempo = colFilters.tempo === 'Todos' || String(act.tempo_gasto) === String(colFilters.tempo);
          const matchHoras = colFilters.horas === 'Todos' || String(act.horas_mes) === String(colFilters.horas);
          return matchGlobalSearch && matchAtiv && matchCat && matchFreq && matchJur && matchDescCol && matchTempo && matchHoras;
        });

        const totalFilteredHours = filteredActivities.reduce((acc, curr) => acc + curr.horas_mes, 0).toFixed(1);
        const hasActiveFilters = searchDetail || JSON.stringify(colFilters) !== JSON.stringify(initialColFilters);

        return (
          <div className="max-w-[100%] mx-auto animate-fade-in relative">
            <button onClick={() => handleSelectPerson(null)} className="mb-6 flex items-center gap-2 text-slate-400 hover:text-white transition group cursor-pointer">
              <span className="group-hover:-translate-x-1 transition transform">←</span>
              <span className="font-semibold uppercase tracking-wider text-sm">Voltar à Visão Executiva</span>
            </button>
            <Header />
            <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 px-4">
              <div>
                <h1 className="text-[#EDB709] font-bold tracking-widest uppercase mb-2 text-sm">Raio-X de Atividades</h1>
                <h2 className="text-4xl font-light text-white">{selectedPerson.name}</h2>
              </div>
              <div className="mt-4 md:mt-0 flex gap-8">
                <div className="text-right">
                  <div className="text-slate-400 text-sm font-semibold uppercase tracking-wider">Carga Mensal</div>
                  <div className="text-3xl font-bold text-white transition-all duration-500">{selectedPerson.hours}<span className="text-xl text-[#EDB709]">h</span></div>
                </div>
                <div className="text-right">
                  <div className="text-slate-400 text-sm font-semibold uppercase tracking-wider">Tarefas</div>
                  <div className="text-3xl font-bold text-white transition-all duration-500">{selectedPerson.tasks}</div>
                </div>
              </div>
            </div>

            <div className="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-3xl shadow-xl mb-8">
              <h3 className="text-xl font-bold text-white mb-2">Onde o tempo é investido?</h3>
              <p className="text-sm text-slate-400 mb-6">Agrupamento das principais atividades que mais consomem as {selectedPerson.hours}h mensais.</p>
              <div className="space-y-5">
                {selectedPerson.topCategories.map((cat, idx) => (
                  <div key={idx} className="relative">
                    <div className="flex justify-between text-sm mb-2">
                      <span className="font-medium text-slate-200">{cat.name}</span>
                      <span className="text-[#EDB709] font-bold">{cat.hours}h <span className="text-slate-500 font-normal ml-1">({((cat.hours / selectedPerson.hours) * 100).toFixed(1)}%)</span></span>
                    </div>
                    <div className="w-full bg-slate-800/50 rounded-full h-4 backdrop-blur-sm overflow-hidden">
                      <div className="bg-gradient-to-r from-blue-500 to-[#EDB709] h-4 rounded-full relative transition-all duration-1000 ease-out" style={{ width: `${(cat.hours / maxCatHours) * 100}%` }}></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl shadow-xl overflow-hidden">
              <div className="p-6 border-b border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h3 className="text-lg font-bold text-white">Detalhamento Completo</h3>
                  <span className="text-xs text-slate-400">
                    A exibir <strong className="text-[#EDB709]">{filteredActivities.length}</strong> de {selectedPerson.activities.length} tarefas (<strong className="text-[#EDB709]">{totalFilteredHours}h</strong> acumuladas)
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <div className="relative min-w-[240px]">
                    <input type="text" placeholder="🔍 Pesquisa geral..." value={searchDetail} onChange={(e) => setSearchDetail(e.target.value)} className="w-full bg-slate-800/90 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-400 outline-none focus:border-[#EDB709] transition" />
                    {searchDetail && (
                      <button onClick={() => setSearchDetail('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">✕</button>
                    )}
                  </div>
                  {hasActiveFilters && (
                    <button onClick={resetAllFilters} className="text-xs bg-[#EDB709]/20 hover:bg-[#EDB709]/30 border border-[#EDB709]/40 text-[#EDB709] font-bold px-3 py-1.5 rounded-xl transition cursor-pointer">
                      Limpar Filtros
                    </button>
                  )}
                </div>
              </div>

              <div className="overflow-x-auto p-2">
                <table className="w-full text-left border-collapse whitespace-nowrap">
                  <thead>
                    <tr className="bg-white/5 text-slate-300 text-xs uppercase tracking-wider">
                      <th className="p-3 font-semibold text-[#EDB709] rounded-tl-xl">Atividade</th>
                      <th className="p-3 font-semibold">Categoria</th>
                      <th className="p-3 font-semibold text-center">Frequência</th>
                      <th className="p-3 font-semibold text-center">Jurídica?</th>
                      <th className="p-3 font-semibold min-w-[280px]">Observações / Detalhes</th>
                      <th className="p-3 font-semibold text-right">Tempo/Tarefa</th>
                      <th className="p-3 font-semibold text-right text-[#EDB709] rounded-tr-xl">H's Mês</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredActivities.map((act, idx) => (
                      <tr key={idx} className="border-t border-white/10 hover:bg-white/5 transition duration-200">
                        <td className="p-3 text-white text-xs font-bold">{act.desc2}</td>
                        <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-blue-500/20 text-blue-300 border border-blue-500/30">{act.tipo}</span></td>
                        <td className="p-3 text-center"><span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[11px]">{act.frequencia}</span></td>
                        <td className="p-3 text-center"><span className="px-2 py-0.5 rounded text-[11px] font-bold text-green-400">{act.juridica}</span></td>
                        <td className="p-3 text-slate-400 text-xs whitespace-normal min-w-[280px] leading-snug">{act.descricao}</td>
                        <td className="p-3 text-right text-slate-300 text-xs font-mono">{act.tempo_gasto}h</td>
                        <td className="p-3 text-right text-base font-bold text-[#EDB709] bg-white/5">{act.horas_mes}h</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-[100%] mx-auto animate-fade-in relative">
          <Header />
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div className="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-3xl shadow-xl">
              <h3 className="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Esforço Operacional</h3>
              <div className="flex items-end gap-2">
                <span className="text-5xl font-bold text-white">{metrics.totalHours}</span>
                <span className="text-xl text-slate-400 mb-1">horas</span>
              </div>
            </div>
            <div className="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-3xl shadow-xl">
              <h3 className="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Volume Processado</h3>
              <div className="flex items-end gap-2">
                <span className="text-5xl font-bold text-white">{metrics.totalTasks}</span>
                <span className="text-xl text-slate-400 mb-1">tarefas/rotinas</span>
              </div>
            </div>
            <div className="bg-gradient-to-br from-[#002B49]/80 to-[#001524]/80 backdrop-blur-md border border-[#EDB709]/30 p-8 rounded-3xl shadow-[0_0_30px_rgba(237,183,9,0.1)] relative overflow-hidden">
              <h3 className="text-[#EDB709] text-sm font-semibold uppercase tracking-wider mb-2">Carga em Rotinas</h3>
              <div className="flex items-end gap-2">
                <span className="text-5xl font-bold text-white">{metrics.routinePct}%</span>
                <span className="text-sm text-slate-300 mb-2 max-w-[100px] leading-tight ml-2">em tarefas repetitivas</span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-3xl shadow-xl">
              <h3 className="text-xl font-bold text-white mb-2">Carga por Especialista</h3>
              <p className="text-sm text-slate-400 mb-6">Clique num perfil para abrir o Raio-X individual com Gráficos.</p>
              <div className="space-y-4">
                {team.map((member, idx) => (
                  <div key={idx} onClick={() => handleSelectPerson(member)} className="relative p-4 rounded-2xl border border-transparent hover:bg-white/10 hover:border-white/10 cursor-pointer transition duration-300 group">
                    <div className="flex justify-between text-sm mb-2">
                      <span className="font-semibold text-slate-200 group-hover:text-white transition">{member.name} <span className="text-slate-500 font-normal ml-2">({member.tasks} tarefas)</span></span>
                      <span className="text-[#EDB709] font-bold">{member.hours}h ➔</span>
                    </div>
                    <div className="w-full bg-slate-800/50 rounded-full h-3 overflow-hidden">
                      <div className="bg-gradient-to-r from-blue-600 to-[#EDB709] h-3 rounded-full" style={{ width: `${(member.hours / maxHours) * 100}%` }}></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-3xl shadow-xl flex flex-col">
              <h3 className="text-xl font-bold text-white mb-2">Principais Gargalos</h3>
              <p className="text-sm text-slate-400 mb-6">As tarefas que mais consomem tempo.</p>
              <div className="space-y-4 overflow-y-auto pr-2">
                {team.map((member, idx) => (
                  <div key={idx} className="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <div className="text-xs text-[#EDB709] font-bold mb-1 uppercase tracking-wider">{member.name}</div>
                    <div className="text-sm font-medium text-slate-300">{member.bottleneck}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
